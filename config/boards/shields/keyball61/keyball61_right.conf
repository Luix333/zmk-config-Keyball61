CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_EXT_POWER=y

# SpaceMouse (Luix333/zmk-spacemouse): the 3D layers turn the trackball into a 6DoF CAD mouse,
# sent on a second USB HID interface and a second BLE HID service
CONFIG_ZMK_SPACEMOUSE=y
CONFIG_USB_HID_DEVICE_COUNT=2

# Pose as a 3Dconnexion SpaceMouse so the official 3DxWare driver accepts it.
# Remove these lines to give the keyboard back its own identity (re-pair BLE either way).
CONFIG_USB_DEVICE_VID=0x256F
CONFIG_USB_DEVICE_PID=0xC631
CONFIG_USB_DEVICE_MANUFACTURER="3Dconnexion"
CONFIG_USB_DEVICE_PRODUCT="SpaceMouse Pro Wireless (cabled)"
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x256F
CONFIG_BT_DIS_PNP_PID=0xC63A
